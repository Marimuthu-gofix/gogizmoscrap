# Full buyback scrape on GitHub's machines (free), twice a week, posting every
# price to the Hostinger store. Nothing is kept on the runner: the rows go to
# PRICE_API_URL as they are scraped.
#
# Setup, once, on GitHub: repository > Settings > Secrets and variables >
# Actions > New repository secret:
#   PRICE_API_URL = https://YOUR-SITE/api
#   PRICE_API_KEY = the api_key from api/config.php on Hostinger
#
# Run it by hand any time: Actions tab > "Full scrape" > Run workflow,
# optionally for one platform, brand or model. The Hostinger dashboard's
# scrape buttons start this same workflow (see hostinger_site/README.md).
name: Full scrape

on:
  schedule:
    # Every Monday and Thursday at 07:00 India time. GitHub's cron is in UTC,
    # so that is 01:30 UTC the same days (1 = Monday, 4 = Thursday).
    - cron: "30 1 * * 1,4"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to scrape"
        type: choice
        default: all
        options: [all, cashify, dofy]
      brand:
        description: 'Brand, e.g. "Apple" or "Apple,Samsung" ("all" for every brand)'
        type: string
        default: all
      model:
        description: "Only models containing this text (optional)"
        type: string
        default: ""

# Never run two scrapes at once; a second start waits for the first to finish.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PRICE_API_URL: ${{ secrets.PRICE_API_URL }}
      PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
      SCRAPE_PLATFORM: ${{ inputs.platform || 'all' }}
      SCRAPE_BRAND: ${{ inputs.brand || 'all' }}
      SCRAPE_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scraper itself only uses the standard library; nothing to install.

      - name: Check the price store is reachable
        run: |
          if [ -z "$PRICE_API_URL" ] || [ -z "$PRICE_API_KEY" ]; then
            echo "::error::Add the PRICE_API_URL and PRICE_API_KEY secrets to this repository (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -fsS "$PRICE_API_URL/health"
          echo
          curl -fsS -H "X-API-Key: $PRICE_API_KEY" "$PRICE_API_URL/status"
          echo

      - name: Scrape
        run: |
          args=(--platform "$SCRAPE_PLATFORM" --brand "${SCRAPE_BRAND:-all}" --delay 0.4 --db scrape.sqlite3)
          if [ -n "$SCRAPE_MODEL" ]; then
            args+=(--model "$SCRAPE_MODEL")
          fi
          echo "Running: buyback.py scrape ${args[*]}"
          python buyback.py scrape "${args[@]}"

      - name: Show what the store holds now
        if: always()
        run: |
          curl -fsS -H "X-API-Key: $PRICE_API_KEY" "$PRICE_API_URL/status" || true

      # A copy of this run's rows, kept two weeks, in case the store was down.
      - name: Keep this run's rows as a backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ github.run_id }}
          path: scrape.sqlite3
          retention-days: 14
          if-no-files-found: ignore
